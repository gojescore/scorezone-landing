<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <title>ScoreZone – Matematik</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Shared seasonal background -->
  <link rel="stylesheet" href="https://scorezone.dk/assets/scorezone-season.css">
  <script src="https://scorezone.dk/assets/scorezone-season.js" defer></script>

  <style>
    :root{
      --bg:#050E3C;
      --panel:rgba(0,36,85,.92);
      --ink:#ffffff;
      --muted:rgba(255,255,255,.78);
      --line:rgba(255,255,255,.14);
      --accent:#DC0000;
      --shadow:0 18px 46px rgba(0,0,0,.28);
      --shadowSoft:0 12px 28px rgba(0,0,0,.22);
    }

    *{ box-sizing:border-box }

    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:var(--bg);
      color:var(--ink);
    }

    .wrap{
      max-width:980px;
      margin:0 auto;
      padding:32px 18px 48px;
    }

    header{
      padding:22px;
      border-radius:22px;
      background:linear-gradient(180deg, rgba(0,36,85,.96), rgba(0,36,85,.86));
      border:1px solid var(--line);
      box-shadow:var(--shadow);
      text-align:center;
    }

    h1{
      margin:0;
      font-size:34px;
      font-weight:950;
      letter-spacing:.3px;
    }

    .lead{
      margin-top:8px;
      font-size:16px;
      font-weight:650;
      color:var(--muted);
    }

    .tiles{
      margin-top:22px;
      display:grid;
      grid-template-columns:repeat(3, minmax(220px,1fr));
      gap:14px;
    }

    .tile{
      display:flex;
      gap:12px;
      align-items:center;
      padding:14px;
      border-radius:16px;
      border:1px solid var(--line);
      background:var(--panel);
      box-shadow:var(--shadowSoft);
      text-decoration:none;
      color:inherit;
      transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    }

    .tile:hover{
      transform:translateY(-2px);
      box-shadow:var(--shadow);
      border-color:rgba(255,56,56,.55);
    }

    .icon{
      width:46px;
      height:46px;
      border-radius:14px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:22px;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.10);
      flex:0 0 auto;
    }

    .text{
      display:flex;
      flex-direction:column;
      gap:2px;
      min-width:0;
    }

    .title{
      font-weight:950;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .sub{
      font-size:13px;
      color:var(--muted);
      font-weight:650;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .back{
      margin-top:26px;
      display:inline-block;
      font-weight:850;
      color:var(--ink);
      text-decoration:none;
      opacity:.9;
    }

    .back:hover{ opacity:1 }

    @media (max-width:900px){
      .tiles{ grid-template-columns:1fr }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <header>
      <h1 data-i18n="math.title">Matematik</h1>
      <div class="lead" data-i18n="math.lead">
        Vælg et spil og gå i gang
      </div>
    </header>

    <main class="tiles">
      <a class="tile" href="/math/minus2.html">
        <div class="icon">➖</div>
        <div class="text">
          <div class="title" data-i18n="tile.minus2.title">Minus 2</div>
          <div class="sub" data-i18n="tile.minus2.sub">Tocifret subtraktion</div>
        </div>
      </a>

      <a class="tile" href="/math/plus2.html">
        <div class="icon">➕</div>
        <div class="text">
          <div class="title" data-i18n="tile.plus2.title">Plus 2</div>
          <div class="sub" data-i18n="tile.plus2.sub">Tocifret addition</div>
        </div>
      </a>

      <a class="tile" href="/math/plus-minus.html">
        <div class="icon">➕➖</div>
        <div class="text">
          <div class="title" data-i18n="tile.pm.title">Plus / Minus</div>
          <div class="sub" data-i18n="tile.pm.sub">Vælg plus eller minus</div>
        </div>
      </a>
    </main>

    <a class="back" id="backToMain" href="/" data-i18n="back">
      ← Tilbage til ScoreZone
    </a>

  </div>

<script>
/* ---------------- LANGUAGE CORE (SAFE) ---------------- */
const LANG_KEY = "scorezone_lang";
const SUPPORTED = ["da","en","de","es"];

const I18N = {
  da:{
    "math.title":"Matematik",
    "math.lead":"Vælg et spil og gå i gang",
    "tile.minus2.title":"Minus 2",
    "tile.minus2.sub":"Tocifret subtraktion",
    "tile.plus2.title":"Plus 2",
    "tile.plus2.sub":"Tocifret addition",
    "tile.pm.title":"Plus / Minus",
    "tile.pm.sub":"Vælg plus eller minus",
    "back":"← Tilbage til ScoreZone"
  },
  en:{
    "math.title":"Math",
    "math.lead":"Choose a game to get started",
    "tile.minus2.title":"Minus 2",
    "tile.minus2.sub":"Two-digit subtraction",
    "tile.plus2.title":"Plus 2",
    "tile.plus2.sub":"Two-digit addition",
    "tile.pm.title":"Plus / Minus",
    "tile.pm.sub":"Choose addition or subtraction",
    "back":"← Back to ScoreZone"
  },
  de:{
    "math.title":"Mathe",
    "math.lead":"Wähle ein Spiel",
    "tile.minus2.title":"Minus 2",
    "tile.minus2.sub":"Zweistellige Subtraktion",
    "tile.plus2.title":"Plus 2",
    "tile.plus2.sub":"Zweistellige Addition",
    "tile.pm.title":"Plus / Minus",
    "tile.pm.sub":"Plus oder Minus wählen",
    "back":"← Zurück zu ScoreZone"
  },
  es:{
    "math.title":"Matemáticas",
    "math.lead":"Elige un juego",
    "tile.minus2.title":"Resta 2",
    "tile.minus2.sub":"Resta de dos cifras",
    "tile.plus2.title":"Suma 2",
    "tile.plus2.sub":"Suma de dos cifras",
    "tile.pm.title":"Suma / Resta",
    "tile.pm.sub":"Elegir suma o resta",
    "back":"← Volver a ScoreZone"
  }
};

function readLangFromUrl(){
  const u = new URL(window.location.href);
  const l = u.searchParams.get("lang");
  return (l && SUPPORTED.includes(l)) ? l : null;
}
function getSavedLang(){
  const s = localStorage.getItem(LANG_KEY);
  return (s && SUPPORTED.includes(s)) ? s : null;
}
function browserLang(){
  const b = (navigator.language||"da").toLowerCase().split("-")[0];
  return SUPPORTED.includes(b) ? b : "da";
}
function currentLang(){
  const urlLang = readLangFromUrl();
  if(urlLang){ localStorage.setItem(LANG_KEY,urlLang); return urlLang; }
  const saved = getSavedLang();
  if(saved) return saved;
  const b = browserLang();
  localStorage.setItem(LANG_KEY,b);
  return b;
}
function applyLanguage(lang){
  const dict = I18N[lang] || I18N.da;
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k = el.dataset.i18n;
    if(dict[k]) el.textContent = dict[k];
  });
}
function withLang(href, lang){
  const u = new URL(href, window.location.href);
  u.searchParams.set("lang", lang);
  return u.toString();
}

const lang = currentLang();
applyLanguage(lang);

// ensure back link keeps lang
const back = document.getElementById("backToMain");
if(back){
  back.href = withLang(back.getAttribute("href"), lang);
}

// auto-pass lang on internal links
document.addEventListener("click",(e)=>{
  const a = e.target.closest("a");
  if(!a) return;
  if(e.metaKey||e.ctrlKey||e.shiftKey||e.altKey) return;

  const href = a.getAttribute("href");
  if(!href || href.startsWith("http")) return;

  e.preventDefault();
  window.location.href = withLang(href, lang);
});
</script>

</body>
</html>
