<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ScoreZone – Math</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Seasonal background system -->
  <link rel="stylesheet" href="https://scorezone.dk/assets/scorezone-season.css">
  <script src="https://scorezone.dk/assets/scorezone-season.js" defer></script>

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png">

  <style>
    :root{
      --bg:#050E3C;
      --panel:rgba(0,36,85,.92);
      --ink:#ffffff;
      --muted:rgba(255,255,255,.78);
      --line:rgba(255,255,255,.14);

      --accent:#DC0000;
      --accentSoft:#FF3838;

      --shadowSoft:0 12px 28px rgba(0,0,0,.22);
      --shadow:0 18px 46px rgba(0,0,0,.28);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:var(--bg);
      color:var(--ink);
    }

    .wrap{
      max-width:980px;
      margin:0 auto;
      padding:32px 18px 48px;
    }

    .hero{
      padding:28px 24px;
      border-radius:22px;
      background: linear-gradient(180deg, rgba(0,36,85,.96), rgba(0,36,85,.86));
      border:1px solid var(--line);
      box-shadow:var(--shadow);
      text-align:center;
      position:relative;
    }

    .hero h1{
      margin:0;
      font-size:38px;
      font-weight:950;
      letter-spacing:.3px;
    }

    .heroLead{
      margin:10px auto 0;
      max-width:560px;
      font-size:16px;
      font-weight:650;
      color:var(--muted);
      line-height:1.45;
    }

    .backRow{
      margin-top:12px;
      display:flex;
      justify-content:center;
    }

    .backLink{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:10px 14px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.06);
      color:var(--ink);
      text-decoration:none;
      font-weight:850;
      box-shadow:var(--shadowSoft);
      transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    }

    .backLink:hover{
      transform:translateY(-1px);
      box-shadow:var(--shadow);
      border-color:rgba(255,56,56,.55);
    }

    .backLink:focus-visible{
      outline:3px solid rgba(255,56,56,.55);
      outline-offset:2px;
    }

    /* ---------- LANGUAGE BAR ---------- */
    .langBar{
      margin-top:12px;
      padding:10px 12px;
      border-radius:18px;
      border:1px solid var(--line);
      background:var(--panel);
      box-shadow:var(--shadowSoft);
    }

    .langRowWrap{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .langLabel{
      font-weight:950;
      letter-spacing:.15px;
      font-size:14px;
      color:var(--ink);
      white-space:nowrap;
      margin-right:2px;
    }

    .arrowBtn{
      width:34px;
      height:34px;
      border-radius:12px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.06);
      box-shadow:0 6px 16px rgba(0,0,0,.18);
      cursor:pointer;
      font-weight:950;
      color:var(--ink);
      flex:0 0 auto;
      transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    }

    .arrowBtn:hover{
      transform:translateY(-1px);
      box-shadow:0 12px 28px rgba(0,0,0,.24);
      border-color:rgba(255,56,56,.55);
    }

    .arrowBtn:active{ transform:translateY(0px); }

    .arrowBtn:focus-visible{
      outline:3px solid rgba(255,56,56,.55);
      outline-offset:2px;
    }

    .langRow{
      display:flex;
      gap:10px;
      overflow-x:auto;
      scroll-behavior:smooth;
      padding:2px 2px 4px;
      flex:1 1 auto;
      scrollbar-width:thin;
    }

    .langRow::-webkit-scrollbar{ height:10px; }
    .langRow::-webkit-scrollbar-thumb{
      background:rgba(255,255,255,.22);
      border-radius:999px;
    }
    .langRow::-webkit-scrollbar-track{
      background:rgba(255,255,255,.08);
      border-radius:999px;
    }

    .langChip{
      border:1px solid var(--line);
      background:rgba(255,255,255,.06);
      box-shadow:0 10px 22px rgba(0,0,0,.18);
      border-radius:999px;
      padding:8px 12px;
      display:flex;
      align-items:center;
      gap:8px;
      cursor:pointer;
      white-space:nowrap;
      font-weight:850;
      color:var(--ink);
      transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease, background .12s ease;
      user-select:none;
    }

    .langChip:hover{
      transform:translateY(-1px);
      box-shadow:0 18px 34px rgba(0,0,0,.24);
      border-color:rgba(255,56,56,.55);
    }

    .langChip[aria-selected="true"]{
      background:rgba(220,0,0,.22);
      border-color:rgba(255,56,56,.70);
      box-shadow:0 18px 40px rgba(220,0,0,.18);
    }

    .langChip:focus-visible{
      outline:3px solid rgba(255,56,56,.55);
      outline-offset:2px;
    }

    /* ---------- TILES ---------- */
    .tiles{
      margin-top:18px;
      display:grid;
      grid-template-columns:repeat(3, minmax(220px,1fr));
      gap:14px;
    }

    .tile{
      display:flex;
      gap:12px;
      align-items:center;
      text-decoration:none;
      padding:14px;
      border-radius:16px;
      border:1px solid var(--line);
      background:var(--panel);
      box-shadow:var(--shadowSoft);
      color:inherit;
      min-height:74px;
      transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    }

    .tile:hover{
      transform:translateY(-2px);
      box-shadow:var(--shadow);
      border-color:rgba(255,56,56,.55);
    }

    .tile:focus-visible{
      outline:3px solid rgba(255,56,56,.55);
      outline-offset:2px;
    }

    .icon{
      width:46px;
      height:46px;
      border-radius:14px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:22px;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.10);
      flex:0 0 auto;
    }

    .text{
      display:flex;
      flex-direction:column;
      gap:2px;
      min-width:0;
    }

    .title{
      font-weight:950;
      letter-spacing:.15px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      color:var(--ink);
    }

    .sub{
      font-size:13px;
      color:var(--muted);
      font-weight:650;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    @media (max-width:900px){
      .tiles{grid-template-columns:1fr;}
      .hero h1{font-size:32px;}
      .wrap{padding-top:26px;}
      .arrowBtn{display:none;}
      .langLabel{display:none;}
    }
  </style>
</head>

<body>
  <div class="wrap">

    <section class="hero">
      <h1 data-i18n="math.hero.title">Math</h1>
      <p class="heroLead" data-i18n="math.hero.lead">Choose a game.</p>

      <div class="backRow">
        <a class="backLink" href="/" data-i18n="math.back">← Back to ScoreZone</a>
      </div>
    </section>

    <section class="langBar" aria-label="Language selector">
      <div class="langRowWrap">
        <div class="langLabel" data-i18n="lang.label">Language</div>

        <button class="arrowBtn" id="langPrev" type="button" aria-label="Scroll languages left">‹</button>

        <div class="langRow" id="langRow" role="listbox" aria-label="Languages" tabindex="0">
          <!-- buttons generated by JS -->
        </div>

        <button class="arrowBtn" id="langNext" type="button" aria-label="Scroll languages right">›</button>
      </div>
    </section>

    <main class="tiles" aria-label="Math games">
      <a class="tile" href="/math/minus2">
        <div class="icon">➖</div>
        <div class="text">
          <div class="title" data-i18n="math.tile.minus2.title">Minus2</div>
          <div class="sub" data-i18n="math.tile.minus2.sub">Two-digit subtraction</div>
        </div>
      </a>

      <!-- Optional: keep links to existing games (remove if you don't want them here yet) -->
      <a class="tile" href="/plus/">
        <div class="icon">➕</div>
        <div class="text">
          <div class="title" data-i18n="math.tile.plus2.title">Plus 2</div>
          <div class="sub" data-i18n="math.tile.plus2.sub">Two-digit addition</div>
        </div>
      </a>

      <a class="tile" href="/plus-minus/">
        <div class="icon">➕➖</div>
        <div class="text">
          <div class="title" data-i18n="math.tile.plusminus.title">Plus/Minus</div>
          <div class="sub" data-i18n="math.tile.plusminus.sub">Addition and subtraction</div>
        </div>
      </a>
    </main>

  </div>

  <script>
    const LANG_KEY = "scorezone_lang";

    const languages = [
      { code: "da", label: "Dansk",   flag: "🇩🇰" },
      { code: "en", label: "English", flag: "🇬🇧" },
      { code: "de", label: "Deutsch", flag: "🇩🇪" },
      { code: "es", label: "Español", flag: "🇪🇸" }
    ];

    const I18N = {
      da: {
        "lang.label": "Sprog",
        "math.hero.title": "Matematik",
        "math.hero.lead": "Vælg et spil.",
        "math.back": "← Tilbage til ScoreZone",

        "math.tile.minus2.title": "Minus 2",
        "math.tile.minus2.sub": "Subtraktion med to cifre",

        "math.tile.plus2.title": "Plus",
        "math.tile.plus2.sub": "Addition med to cifre",

        "math.tile.plusminus.title": "Plus/Minus",
        "math.tile.plusminus.sub": "Plus og minus"
      },
      en: {
        "lang.label": "Language",
        "math.hero.title": "Math",
        "math.hero.lead": "Choose a game.",
        "math.back": "← Back to ScoreZone",

        "math.tile.minus2.title": "Minus 2",
        "math.tile.minus2.sub": "Two-digit subtraction",

        "math.tile.plus2.title": "Plus",
        "math.tile.plus2.sub": "Two-digit addition",

        "math.tile.plusminus.title": "Plus/Minus",
        "math.tile.plusminus.sub": "Addition and subtraction"
      },
      de: {
        "lang.label": "Sprache",
        "math.hero.title": "Mathe",
        "math.hero.lead": "Wähle ein Spiel.",
        "math.back": "← Zurück zu ScoreZone",

        "math.tile.minus2.title": "Minus 2",
        "math.tile.minus2.sub": "Zweistellige Subtraktion",

        "math.tile.plus2.title": "Plus",
        "math.tile.plus2.sub": "Zweistellige Addition",

        "math.tile.plusminus.title": "Plus/Minus",
        "math.tile.plusminus.sub": "Addition und Subtraktion"
      },
      es: {
        "lang.label": "Idioma",
        "math.hero.title": "Matemáticas",
        "math.hero.lead": "Elige un juego.",
        "math.back": "← Volver a ScoreZone",

        "math.tile.minus2.title": "Minus 2",
        "math.tile.minus2.sub": "Resta de dos cifras",

        "math.tile.plus2.title": "Suma",
        "math.tile.plus2.sub": "Suma de dos cifras",

        "math.tile.plusminus.title": "Suma/Resta",
        "math.tile.plusminus.sub": "Suma y resta"
      }
    };

    const row = document.getElementById("langRow");
    const prevBtn = document.getElementById("langPrev");
    const nextBtn = document.getElementById("langNext");

    function getSavedLang(){
      const saved = localStorage.getItem(LANG_KEY);
      if (saved && languages.some(l => l.code === saved)) return saved;
      return "da";
    }

    function setSavedLang(code){
      localStorage.setItem(LANG_KEY, code);
    }

    function readLangFromUrl(){
      const url = new URL(window.location.href);
      const lang = url.searchParams.get("lang");
      if (lang && languages.some(l => l.code === lang)) return lang;
      return null;
    }

    function applyLanguage(lang){
      const dict = I18N[lang] || I18N.da;

      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        const value = dict[key];
        if (typeof value === "string") el.textContent = value;
      });

      document.documentElement.lang = lang;
    }

    function renderLanguages(){
      row.innerHTML = "";
      const selected = getSavedLang();

      for (const lang of languages){
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "langChip";
        btn.setAttribute("role", "option");
        btn.dataset.lang = lang.code;

        const isSelected = lang.code === selected;
        btn.setAttribute("aria-selected", isSelected ? "true" : "false");

        btn.innerHTML = `
          <span aria-hidden="true">${lang.flag}</span>
          <span>${lang.label}</span>
        `;

        btn.addEventListener("click", () => {
          setSavedLang(lang.code);
          updateSelectedUI(lang.code);
          applyLanguage(lang.code);
        });

        row.appendChild(btn);
      }
    }

    function updateSelectedUI(code){
      const chips = row.querySelectorAll(".langChip");
      chips.forEach(chip => {
        const isSelected = chip.dataset.lang === code;
        chip.setAttribute("aria-selected", isSelected ? "true" : "false");
        if (isSelected) chip.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
      });
    }

    function scrollRow(dir){
      const amount = Math.max(220, Math.floor(row.clientWidth * 0.8));
      row.scrollBy({ left: dir * amount, behavior: "smooth" });
    }

    prevBtn.addEventListener("click", () => scrollRow(-1));
    nextBtn.addEventListener("click", () => scrollRow(1));

    row.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") scrollRow(-1);
      if (e.key === "ArrowRight") scrollRow(1);
    });

    // Append ?lang=xx to tile navigation on click
    function withLangParam(rawHref, lang){
      const url = new URL(rawHref, window.location.href);
      url.searchParams.set("lang", lang);
      return url.toString();
    }

    document.addEventListener("click", (e) => {
      const tile = e.target.closest("a.tile");
      if (!tile) return;

      if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;

      e.preventDefault();
      const lang = getSavedLang();
      window.location.href = withLangParam(tile.getAttribute("href"), lang);
    });

    // init
    const urlLang = readLangFromUrl();
    if (urlLang) setSavedLang(urlLang);

    renderLanguages();
    applyLanguage(getSavedLang());
    updateSelectedUI(getSavedLang());
  </script>
</body>
</html>
